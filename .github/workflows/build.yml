name: Build Read Aloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ReadAloud-Windows.exe
          - os: macos-latest            # Apple Silicon (M1 and newer)
            artifact: ReadAloud-Mac.zip
            arch: arm64
          - os: macos-15-intel          # Intel Macs (2015-2020)
            artifact: ReadAloud-Mac-Intel.zip
            arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"  # run on macOS Big Sur and later
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install --no-deps -r requirements-nodeps.txt

      - name: Use numpy built for macOS 11 (the default one needs macOS 14)
        if: runner.os == 'macOS'
        run: |
          pip download numpy==2.3.5 --no-deps --only-binary=:all: --python-version 3.12 \
            --implementation cp --abi cp312 --platform macosx_11_0_${{ matrix.arch }} -d mac11
          pip install --force-reinstall --no-deps mac11/numpy-*.whl

      - name: Build espeak-ng for macOS 11 (the packaged copy needs macOS 13.7/14)
        if: runner.os == 'macOS'
        run: |
          git clone -q --depth 1 --branch 1.52.0 https://github.com/espeak-ng/espeak-ng.git espeak-src
          cmake -S espeak-src -B espeak-build -DBUILD_SHARED_LIBS=ON -DUSE_MBROLA=OFF \
            -DUSE_LIBSONIC=OFF -DUSE_LIBPCAUDIO=OFF -DUSE_ASYNC=OFF -DUSE_SPEECHPLAYER=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build espeak-build --target espeak-ng -j3
          built=espeak-build/src/libespeak-ng/libespeak-ng.1.52.0.dylib
          dest=$(python -c "import espeakng_loader, os; print(os.path.dirname(espeakng_loader.__file__))")
          for f in "$dest"/libespeak-ng*.dylib; do rm -f "$f"; cp "$built" "$f"; done
          python scripts/check_macos_compat.py "$dest" ${{ matrix.arch }} 11.0

      - name: Build
        run: pyinstaller ReadAloud.spec --noconfirm --clean

      - name: Self-test (Windows) - launch the real .exe, fetch real speech
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\selftest.json"
          $env:READ_ALOUD_AUDIO_BACKEND = "null"   # CI machines have no speakers
          $p = Start-Process -FilePath "dist\ReadAloud.exe" -ArgumentList "--selftest","$out" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "app did not finish self-test" }
          python scripts/check_selftest.py $out

      - name: Self-test (Mac) - launch the real .app, fetch real speech
        if: runner.os == 'macOS'
        run: |
          out="$RUNNER_TEMP/selftest.json"
          READ_ALOUD_AUDIO_BACKEND=null "dist/Read Aloud.app/Contents/MacOS/Read Aloud" --selftest "$out" &
          pid=$!
          for i in $(seq 1 300); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          python scripts/check_selftest.py "$out"

      - name: Test closing it like a normal app (taskbar / Dock)
        if: runner.os == 'Windows'
        run: python scripts/test_close.py dist\ReadAloud.exe

      - name: Test closing it like a normal app (Dock > Quit)
        if: runner.os == 'macOS'
        run: python scripts/test_close.py "dist/Read Aloud.app"

      - name: Check it runs on older Macs (right chip, macOS 11+)
        if: runner.os == 'macOS'
        run: python scripts/check_macos_compat.py "dist/Read Aloud.app" ${{ matrix.arch }} 11.0

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: copy dist\ReadAloud.exe ${{ matrix.artifact }}

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Read Aloud.app" ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Read Aloud 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            ReadAloud-Windows.exe
            ReadAloud-Mac.zip
            ReadAloud-Mac-Intel.zip
          body: |
            **Windows:** download `ReadAloud-Windows.exe` and double-click it.
            **Mac with Apple Silicon (M1 or newer):** download `ReadAloud-Mac.zip`.
            **Mac with Intel chip (2015-2020, macOS 11 Big Sur or newer):** download `ReadAloud-Mac-Intel.zip`.
            Not sure which Mac you have? Apple menu > About This Mac: "Chip: Apple M..." means Apple Silicon, "Processor: ... Intel" means Intel.
            On Mac, open the zip and drag **Read Aloud** into Applications.

            See the README for first-launch steps (unsigned app warnings).
